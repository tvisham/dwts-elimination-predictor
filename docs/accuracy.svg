<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 310' width='760' height='310' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='310' fill='white'/><text x='24' y='32' font-size='17' font-weight='600' fill='#1f1a3a'>The model picks who goes home 42% of the time</text><text x='24' y='54' font-size='13' fill='#6b6488'>Backtest, seasons 21–34 (102 elimination weeks), each season predicted from earlier seasons only</text><text x='238' y='102' font-size='14' text-anchor='end' fill='#1f1a3a'>Judges + viewers rule</text><rect x='250' y='84' width='372.4' height='26' rx='4' fill='#c99a2e'/><text x='630.4' y='102' font-size='14' font-weight='600' fill='#1f1a3a'>42%</text><text x='238' y='142' font-size='14' text-anchor='end' fill='#1f1a3a'>Same inputs, no ranking rule</text><rect x='250' y='124' width='359.5' height='26' rx='4' fill='#b9b4cc'/><text x='617.5' y='142' font-size='14' font-weight='600' fill='#1f1a3a'>41%</text><text x='238' y='182' font-size='14' text-anchor='end' fill='#1f1a3a'>Judges' rank only</text><rect x='250' y='164' width='333.6' height='26' rx='4' fill='#b9b4cc'/><text x='591.6' y='182' font-size='14' font-weight='600' fill='#1f1a3a'>38%</text><text x='238' y='222' font-size='14' text-anchor='end' fill='#1f1a3a'>Lowest judges' score goes home</text><rect x='250' y='204' width='306.0' height='26' rx='4' fill='#b9b4cc'/><text x='564.0' y='222' font-size='14' font-weight='600' fill='#1f1a3a'>35%</text><text x='238' y='262' font-size='14' text-anchor='end' fill='#1f1a3a'>Random guess</text><rect x='250' y='244' width='125.7' height='26' rx='4' fill='#b9b4cc'/><text x='383.7' y='262' font-size='14' font-weight='600' fill='#1f1a3a'>14%</text><text x='24' y='298' font-size='12' fill='#6b6488'>The eliminated couple was in the model's bottom three 77% of the time. Log loss 1.47 vs 1.56 (judges only) and 1.94 (random).</text></svg>